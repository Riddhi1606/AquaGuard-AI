version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: aquaguard-postgis
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquaguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-aquaguard_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquaguard} -d ${POSTGRES_DB:-aquaguard_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    container_name: aquaguard-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aquaguard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aquaguard_db}
      SECRET_KEY: ${SECRET_KEY:?Set a strong SECRET_KEY in your .env file}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in your .env file}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      PILOT_CITY: Jaipur
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    container_name: aquaguard-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
